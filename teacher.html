<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>오르빗 게이트 · 교사용 수업 슬라이드</title>
    <style>
      html, body { margin: 0; height: 100%; background: #23254d; color: #f4f6ff; }
      body { font: 600 clamp(18px, 2.3vw, 34px)/1.5 "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif; display: flex; flex-direction: column; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3vh 6vw; }
      section { max-width: 1100px; width: 100%; background: #1b1f3b; border: 6px solid #7df9ff; box-shadow: 8px 8px 0 #0008; padding: 4vh 4vw; }
      h1 { margin: 0 0 0.4em; font-size: 1.7em; color: #ffc93c; line-height: 1.2; }
      ul, ol { margin: 0.3em 0; padding-left: 1.2em; } li { margin: 0.25em 0; }
      b { color: #ffe27a; } small { color: #a9b0d6; font-size: 0.6em; }
      .steps { display: flex; flex-wrap: wrap; gap: 0.5em; margin: 0.6em 0; }
      .steps span { background: #3f7fe0; border: 4px solid #101330; padding: 0.2em 0.6em; }
      .join { display: flex; gap: 4vw; align-items: center; } .join img { width: min(38vh, 380px); image-rendering: pixelated; background: #fff; padding: 12px; }
      .url { font-size: 0.9em; word-break: break-all; color: #7df9ff; }
      nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5vh 3vw; font-size: 0.6em; }
      button { font: inherit; color: #1b1f3b; background: #ffe27a; border: 4px solid #1b1f3b; box-shadow: 4px 4px 0 #0008; padding: 0.3em 1em; cursor: pointer; }
    </style>
  </head>
  <body>
    <main><section id="slide"></section></main>
    <nav><button id="prev">← 이전</button><span id="count"></span><button id="next">다음 →</button></nav>
    <script>
      const student = new URL("./", location.href).href;
      const slides = [
        `<h1>오르빗 게이트<br>AI에게 우주항을 맡긴다면?</h1>6학년 실과 「인공지능이 만들어지는 과정」<br><small>← → 키 또는 아래 단추로 넘깁니다. 마지막 장에 학생 입장 QR이 있습니다.</small>`,
        `<h1>인공지능은 이렇게 만들어져요</h1><div class="steps"><span>① 사례 모으기</span><span>② 이름표 붙이기</span><span>③ 학습</span><span>④ 새 사례로 평가</span><span>⑤ 틀린 것 고치기</span></div>오늘은 우주항 검문소에서 이 다섯 단계를 직접 해 봅니다.`,
        `<h1>① ② 데이터: 내 판정이 AI의 예시가 돼요</h1><ul><li>트럭 한 대를 살펴본 기록이 <b>사례</b> 하나입니다.</li><li>내가 내린 <b>통과 / 보류</b>가 그 사례의 <b>이름표(라벨)</b>입니다.</li><li>내가 틀리게 판정하면 AI도 틀린 것을 배웁니다.</li></ul>`,
        `<h1>③ 학습: 어떤 단서로 배우게 할까?</h1><ul><li>날짜, 얼굴, 화물 모양, 화물 색, 허가증… 무엇을 보고 배우게 할지 내가 고릅니다.</li><li>AI는 예시에서 <b>판정 기준</b>을 스스로 찾습니다.</li><li>트럭 번호를 통째로 <b>외우게</b> 하면 어떻게 될까요?</li></ul>`,
        `<h1>예측과 행동: AI의 말이 문을 움직여요</h1><ul><li>배운 AI는 새 트럭을 보고 <b>통과 / 보류</b>를 예측합니다.</li><li>게임에서는 판정 레버 옆에 AI 스캐너의 예측이 나옵니다.</li><li>AI의 예측을 그대로 믿어도 될까요? 누가 마지막으로 확인해야 할까요?</li></ul>`,
        `<h1>④ ⑤ 평가: 처음 보는 수송대로 시험해요</h1><ul><li>연습 때 본 적 없는 <b>새 트럭 12대</b>로 시험합니다. 처음 보는 색의 화물도 섞여 있습니다.</li><li><b>잘못 통과</b>(막아야 할 것을 보냄)와 <b>잘못 보류</b>(보내야 할 것을 막음)를 따로 셉니다.</li><li>단서를 바꾸거나 사례를 더 모아 다시 가르치고 비교합니다.</li></ul>`,
        `<h1>우리 생활이라면?</h1><ul><li>내 급식 도시락이 위험물로 <b>잘못 분류</b>되면, 누구의 점심이 늦어질까요?</li><li>AI가 친구의 통행증을 <b>잘못 읽으면</b>, 누가 다시 확인해야 할까요?</li><li>잘못 통과와 잘못 보류 중 어느 쪽이 더 곤란할까요? 상황마다 같을까요?</li></ul>`,
        `<h1>게임 방법</h1><ol><li><b>WASD</b> 걷기 · <b>Shift</b> 달리기 · <b>Space</b> 점프 · 마우스 <b>드래그</b>로 둘러보기</li><li><b>운전석</b>에서 <b>E</b>: 통행증 날짜, 사진과 실제 얼굴 비교 (<b>R</b> 진료 기록)</li><li><b>화물칸</b>에서 <b>E</b>: 열기 → 덮개 걷기 → 화물 돌려 보기</li><li>위험 화물이면 <b>Q</b>로 하차 요청, 운전기사에게 <b>E</b>로 몸수색</li><li><b>판정 레버</b>에서 <b>1 통과 / 2 보류</b> · 규칙은 <b>H</b></li><li><b>AI 감식대</b>에서 단서 고르고 학습 · 시험</li></ol><small>한글 입력 상태여도 그대로 됩니다.</small>`,
        `<h1>결과 내는 방법</h1><ul><li>트럭 7대를 판정하면 근무가 끝나고 <b>우주 레인저 등급</b> 결과표가 나옵니다.</li><li><b>PNG 저장</b> 또는 <b>PDF로 저장(인쇄)</b>을 눌러 파일로 만든 뒤, 선생님이 정한 곳에 냅니다.</li><li>이름(별명)은 학생 기기 안에서만 쓰입니다. 계정도, 서버로 가는 기록도 없습니다.</li></ul>`,
        `<h1>제7 우주항으로 출발!</h1><div class="join"><img id="qr" src="join.png" alt="학생 입장 QR" onerror="this.remove()"><div>크롬북으로 QR을 찍거나 주소를 입력하세요.<div class="url">${student}</div><small>이 버전에 없는 것: 그물총과 도주·괴물 사건, 경제와 감시탑, 5주기 허가증과 무한 모드, 캐릭터 꾸미기, 소리, 화물 3종.</small></div></div>`,
      ];
      let i = Math.min(slides.length - 1, Math.max(0, Number(location.hash.slice(1)) - 1 || 0));
      function show() {
        document.getElementById("slide").innerHTML = slides[i];
        document.getElementById("count").textContent = `${i + 1} / ${slides.length}`;
        history.replaceState(null, "", "#" + (i + 1));
      }
      const go = (d) => { i = Math.min(slides.length - 1, Math.max(0, i + d)); show(); };
      document.getElementById("prev").onclick = () => go(-1);
      document.getElementById("next").onclick = () => go(1);
      addEventListener("keydown", (e) => { if (["ArrowRight", "Space", "PageDown", "Enter"].includes(e.code)) go(1); if (["ArrowLeft", "PageUp"].includes(e.code)) go(-1); });
      show();
    </script>
  </body>
</html>
